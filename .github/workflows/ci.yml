name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 24
          cache: npm
      - name: Pin npm for consistent optional dependency installation
        run: npm install --global npm@11.11.0
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run validate:package
      - run: npm pack --dry-run
      - run: npm pack --json > pack.json
      - name: Verify exact package tarball
        run: node scripts/validate-tarball.mjs pack.json "v$(node -p 'require("./package.json").version')"
      - name: Validate ask-user package metadata
        run: node scripts/validate-ask-user-package.mjs
      - name: Pack ask-user workspace
        run: npm pack --workspace packages/ask-user --json > pack-ask-user.json
      - name: Verify exact ask-user package tarball
        run: node scripts/validate-ask-user-tarball.mjs pack-ask-user.json "pi-ask-user-x-v$(node -p 'require("./packages/ask-user/package.json").version')"
