<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 480" width="100%" height="480" role="img" aria-label="pi-translate-x and pi-ask-user-x architecture diagram">
  <title>pi-translate-x architecture diagram</title>
  <desc>Architecture flow showing user interaction in TUI or RPC, translation service over pi.events, submit-only persistence, and canonical English boundary for prepared prose and questionnaire answers</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#58a6ff" />
    </marker>
    <marker id="purpleArrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#bc8cff" />
    </marker>
    <marker id="greenArrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#3fb950" />
    </marker>
  </defs>

  <!-- Background -->
  <rect width="960" height="480" rx="12" fill="#0d1117" stroke="#30363d" stroke-width="2"/>

  <!-- Diagram Title Header -->
  <text x="480" y="36" fill="#f0f6fc" font-family="system-ui, -apple-system, sans-serif" font-size="20" font-weight="700" text-anchor="middle">System Architecture &amp; Context Isolation</text>
  <text x="480" y="58" fill="#8b949e" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="400" text-anchor="middle">Canonical English to Agent · Context-Excluded Persisted Custom Entries · Dedicated Translation Service</text>

  <!-- COLUMN 1: User & UI Layer -->
  <g transform="translate(36, 80)">
    <rect width="210" height="364" rx="8" fill="#161b22" stroke="#30363d" stroke-width="1.5"/>
    <rect width="210" height="34" rx="8" fill="#21262d"/>
    <text x="105" y="22" fill="#f0f6fc" font-family="system-ui, -apple-system, sans-serif" font-size="14" font-weight="600" text-anchor="middle">User Interface Layer</text>

    <!-- Box 1A: Terminal TUI -->
    <rect x="14" y="48" width="182" height="96" rx="6" fill="#0d1117" stroke="#58a6ff" stroke-width="1.5"/>
    <text x="24" y="70" fill="#58a6ff" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="700">Terminal TUI (Full)</text>
    <text x="24" y="88" fill="#c9d1d9" font-family="system-ui, -apple-system, sans-serif" font-size="11">· Native language editor</text>
    <text x="24" y="104" fill="#c9d1d9" font-family="system-ui, -apple-system, sans-serif" font-size="11">· Output translation cards</text>
    <text x="24" y="120" fill="#c9d1d9" font-family="system-ui, -apple-system, sans-serif" font-size="11">· Questionnaire dynamic reflow</text>
    <text x="24" y="134" fill="#8b949e" font-family="system-ui, -apple-system, sans-serif" font-size="10">  (side-by-side / stacked / height 1)</text>

    <!-- Box 1B: Native RPC Dialogs -->
    <rect x="14" y="156" width="182" height="96" rx="6" fill="#0d1117" stroke="#30363d" stroke-width="1"/>
    <text x="24" y="178" fill="#c9d1d9" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="600">Native RPC Dialogs</text>
    <text x="24" y="196" fill="#8b949e" font-family="system-ui, -apple-system, sans-serif" font-size="11">· ctx.mode === "rpc"</text>
    <text x="24" y="212" fill="#8b949e" font-family="system-ui, -apple-system, sans-serif" font-size="11">· ui.select / ui.input / ui.confirm</text>
    <text x="24" y="228" fill="#8b949e" font-family="system-ui, -apple-system, sans-serif" font-size="11">· Text &amp; token degradation</text>
    <text x="24" y="244" fill="#8b949e" font-family="system-ui, -apple-system, sans-serif" font-size="10">  (headless mode unsupported)</text>

    <!-- Box 1C: Local Privacy -->
    <rect x="14" y="264" width="182" height="84" rx="6" fill="#0d1117" stroke="#238636" stroke-width="1"/>
    <text x="24" y="286" fill="#3fb950" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="600">Session Privacy</text>
    <text x="24" y="304" fill="#8b949e" font-family="system-ui, -apple-system, sans-serif" font-size="11">· In-memory draft safety</text>
    <text x="24" y="320" fill="#8b949e" font-family="system-ui, -apple-system, sans-serif" font-size="11">· Cancelled flows discarded</text>
    <text x="24" y="336" fill="#8b949e" font-family="system-ui, -apple-system, sans-serif" font-size="11">· Context-excluded cards</text>
  </g>

  <!-- COLUMN 2: Workspace Extensions -->
  <g transform="translate(282, 80)">
    <!-- Sub-box 2A: pi-translate-x -->
    <rect width="360" height="174" rx="8" fill="#161b22" stroke="#58a6ff" stroke-width="1.5"/>
    <rect width="360" height="32" rx="8" fill="#1f6feb" fill-opacity="0.2"/>
    <text x="180" y="21" fill="#79c0ff" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="700" text-anchor="middle">pi-translate-x (Root Package · v0.1.3)</text>

    <text x="16" y="52" fill="#f0f6fc" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="600">Input Pipeline (Fail-Closed):</text>
    <text x="16" y="68" fill="#8b949e" font-family="system-ui, -apple-system, sans-serif" font-size="11">Translates user prose → Prepared Canonical English</text>

    <text x="16" y="92" fill="#f0f6fc" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="600">Output Cards &amp; Scheduler:</text>
    <text x="16" y="108" fill="#8b949e" font-family="system-ui, -apple-system, sans-serif" font-size="11">Translates assistant prose → Persists custom cards (retryable)</text>

    <rect x="14" y="122" width="332" height="38" rx="6" fill="#0d1117" stroke="#bc8cff" stroke-width="1"/>
    <text x="180" y="140" fill="#d2a8ff" font-family="monospace" font-size="11" font-weight="600" text-anchor="middle">TranslationService (protocol v1 on pi.events)</text>
    <text x="180" y="152" fill="#8b949e" font-family="system-ui, -apple-system, sans-serif" font-size="10" text-anchor="middle">Provides translation channel to companion packages</text>

    <!-- Sub-box 2B: pi-ask-user-x -->
    <g transform="translate(0, 190)">
      <rect width="360" height="174" rx="8" fill="#161b22" stroke="#bc8cff" stroke-width="1.5"/>
      <rect width="360" height="32" rx="8" fill="#8957e5" fill-opacity="0.2"/>
      <text x="180" y="21" fill="#d2a8ff" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="700" text-anchor="middle">pi-ask-user-x (Companion Package · v0.1.1 prepared)</text>

      <text x="16" y="52" fill="#f0f6fc" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="600">Tool: ask_user</text>
      <text x="16" y="68" fill="#8b949e" font-family="system-ui, -apple-system, sans-serif" font-size="11">Separate tool — DOES NOT intercept ask_user_question plugin</text>

      <text x="16" y="94" fill="#f0f6fc" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="600">Stable Option IDs &amp; Re-translation Contract:</text>
      <text x="16" y="110" fill="#8b949e" font-family="system-ui, -apple-system, sans-serif" font-size="11">Options resolve by immutable ID; notes/custom prose translated to EN</text>

      <rect x="14" y="124" width="332" height="38" rx="6" fill="#0d1117" stroke="#238636" stroke-width="1"/>
      <text x="180" y="142" fill="#3fb950" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="600" text-anchor="middle">Submit-Only Persistence Engine</text>
      <text x="180" y="154" fill="#8b949e" font-family="system-ui, -apple-system, sans-serif" font-size="10" text-anchor="middle">Unsubmitted drafts discarded; confirmed answers stored in transcript</text>
    </g>
  </g>

  <!-- COLUMN 3: Pi Coding Agent & External Boundaries -->
  <g transform="translate(678, 80)">
    <!-- Box 3A: Pi Agent & Context -->
    <rect width="246" height="174" rx="8" fill="#161b22" stroke="#238636" stroke-width="1.5"/>
    <rect width="246" height="32" rx="8" fill="#238636" fill-opacity="0.2"/>
    <text x="123" y="21" fill="#3fb950" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="700" text-anchor="middle">Pi Coding Agent / Main Model</text>

    <rect x="14" y="44" width="218" height="114" rx="6" fill="#0d1117" stroke="#238636" stroke-width="1"/>
    <text x="24" y="66" fill="#3fb950" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="700">Prepared Prose Boundary</text>
    <text x="24" y="86" fill="#f0f6fc" font-family="system-ui, -apple-system, sans-serif" font-size="11">✓ Prepared Canonical English</text>
    <text x="24" y="104" fill="#f0f6fc" font-family="system-ui, -apple-system, sans-serif" font-size="11">✓ Canonical Answers &amp; IDs</text>
    <text x="24" y="126" fill="#f85149" font-family="system-ui, -apple-system, sans-serif" font-size="11">✗ Persisted cards (excluded)</text>
    <text x="24" y="144" fill="#f85149" font-family="system-ui, -apple-system, sans-serif" font-size="11">✗ Drafts &amp; raw prose (excluded)</text>

    <!-- Box 3B: External Translation Provider -->
    <g transform="translate(0, 190)">
      <rect width="246" height="174" rx="8" fill="#161b22" stroke="#d29922" stroke-width="1.5"/>
      <rect width="246" height="32" rx="8" fill="#d29922" fill-opacity="0.2"/>
      <text x="123" y="21" fill="#f0883e" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="700" text-anchor="middle">Dedicated Translation Provider</text>

      <rect x="14" y="44" width="218" height="114" rx="6" fill="#0d1117" stroke="#d29922" stroke-width="1"/>
      <text x="24" y="66" fill="#f0883e" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="700">Independent Model Call</text>
      <text x="24" y="86" fill="#c9d1d9" font-family="system-ui, -apple-system, sans-serif" font-size="11">· Configured model &amp; provider</text>
      <text x="24" y="104" fill="#c9d1d9" font-family="system-ui, -apple-system, sans-serif" font-size="11">· Explicit paid token call</text>
      <text x="24" y="122" fill="#f85149" font-family="system-ui, -apple-system, sans-serif" font-size="11">· NO main-model fallback</text>
      <text x="24" y="140" fill="#8b949e" font-family="system-ui, -apple-system, sans-serif" font-size="10">· Malformed config disables</text>
    </g>
  </g>

  <!-- Connective Arrows -->
  <!-- UI to Translate Input -->
  <line x1="246" y1="124" x2="278" y2="124" stroke="#58a6ff" stroke-width="2" marker-end="url(#arrow)"/>
  <!-- Translate to Agent Context -->
  <line x1="642" y1="124" x2="674" y2="124" stroke="#3fb950" stroke-width="2" marker-end="url(#greenArrow)"/>
  <!-- Translate to Translation Service -->
  <line x1="462" y1="254" x2="462" y2="268" stroke="#bc8cff" stroke-width="2" marker-end="url(#purpleArrow)"/>
  <!-- Ask-User to Agent Context -->
  <line x1="642" y1="310" x2="674" y2="236" stroke="#3fb950" stroke-width="2" marker-end="url(#greenArrow)"/>
  <!-- Translate to Provider -->
  <line x1="642" y1="156" x2="674" y2="260" stroke="#d29922" stroke-width="1.5" stroke-dasharray="4 3"/>
</svg>