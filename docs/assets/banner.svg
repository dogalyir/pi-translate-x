<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 220" width="100%" height="220" role="img" aria-label="pi-translate-x project banner">
  <title>pi-translate-x banner</title>
  <desc>Monorepo banner for pi-translate-x translation package and pi-ask-user-x companion questionnaire</desc>
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0d1117" />
      <stop offset="100%" stop-color="#161b22" />
    </linearGradient>
    <linearGradient id="bluePurpleGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#58a6ff" />
      <stop offset="100%" stop-color="#bc8cff" />
    </linearGradient>
    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#21262d" />
      <stop offset="100%" stop-color="#161b22" />
    </linearGradient>
  </defs>

  <!-- Container background -->
  <rect width="960" height="220" rx="12" fill="url(#bgGrad)" stroke="#30363d" stroke-width="2"/>

  <!-- Left Icon Graphic -->
  <g transform="translate(48, 42)">
    <!-- Back card (Target language) -->
    <rect x="36" y="24" width="76" height="88" rx="8" fill="url(#cardGrad)" stroke="#bc8cff" stroke-width="2"/>
    <text x="74" y="76" fill="#bc8cff" font-family="system-ui, -apple-system, sans-serif" font-size="28" font-weight="700" text-anchor="middle">文</text>

    <!-- Front card (Canonical English) -->
    <rect x="12" y="8" width="76" height="88" rx="8" fill="#161b22" stroke="#58a6ff" stroke-width="2"/>
    <text x="50" y="60" fill="#58a6ff" font-family="system-ui, -apple-system, sans-serif" font-size="28" font-weight="700" text-anchor="middle">A</text>

    <!-- Bidirectional exchange arrow pill -->
    <rect x="34" y="104" width="56" height="22" rx="11" fill="#21262d" stroke="#8b949e" stroke-width="1"/>
    <text x="62" y="119" fill="#f0f6fc" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="600" text-anchor="middle">⇄ EN</text>
  </g>

  <!-- Main Title & Descriptions -->
  <g transform="translate(196, 52)">
    <text x="0" y="32" fill="#f0f6fc" font-family="system-ui, -apple-system, sans-serif" font-size="34" font-weight="800" letter-spacing="-0.5">pi-translate-x</text>
    <text x="260" y="32" fill="#58a6ff" font-family="system-ui, -apple-system, sans-serif" font-size="20" font-weight="500">· monorepo</text>

    <text x="0" y="66" fill="#c9d1d9" font-family="system-ui, -apple-system, sans-serif" font-size="15" font-weight="400">
      Context-excluded bilingual translation &amp; structured questionnaire for the Pi coding agent
    </text>

    <!-- Feature badges -->
    <g transform="translate(0, 88)">
      <!-- Badge 1: Cards-First -->
      <rect x="0" y="0" width="94" height="26" rx="6" fill="#1f6feb" fill-opacity="0.2" stroke="#58a6ff" stroke-width="1"/>
      <text x="47" y="17" fill="#79c0ff" font-family="monospace" font-size="12" font-weight="600" text-anchor="middle">cards-first</text>

      <!-- Badge 2: Fail-Closed -->
      <rect x="104" y="0" width="96" height="26" rx="6" fill="#da3633" fill-opacity="0.2" stroke="#f85149" stroke-width="1"/>
      <text x="152" y="17" fill="#ff7b72" font-family="monospace" font-size="12" font-weight="600" text-anchor="middle">fail-closed</text>

      <!-- Badge 3: Context Excluded -->
      <rect x="210" y="0" width="136" height="26" rx="6" fill="#238636" fill-opacity="0.2" stroke="#3fb950" stroke-width="1"/>
      <text x="278" y="17" fill="#56d364" font-family="monospace" font-size="12" font-weight="600" text-anchor="middle">context-excluded</text>

      <!-- Badge 4: Protocol v1 -->
      <rect x="356" y="0" width="138" height="26" rx="6" fill="#8957e5" fill-opacity="0.2" stroke="#bc8cff" stroke-width="1"/>
      <text x="425" y="17" fill="#d2a8ff" font-family="monospace" font-size="12" font-weight="600" text-anchor="middle">protocol v1</text>

      <!-- Badge 5: Zero Main Fallback -->
      <rect x="504" y="0" width="154" height="26" rx="6" fill="#30363d" stroke="#8b949e" stroke-width="1"/>
      <text x="581" y="17" fill="#c9d1d9" font-family="monospace" font-size="12" font-weight="600" text-anchor="middle">no main-model fallback</text>
    </g>
  </g>
</svg>